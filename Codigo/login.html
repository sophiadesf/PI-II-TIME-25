<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/layout.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">

    <!-- Tipografia definida - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="topbar"></div>
    <div class="mt-5 pt-5">
      <div class="card m-3">
        <h2>Entrar</h2>
        <p class="subtitle">Digite suas credenciais para acessar</p>
        
        <!-- Adicionado action="index.html" para redirecionar ao enviar -->
        <form action="index.html">
          <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="seuemail@exemplo.com" required>
          </div>
          
          <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" placeholder="••••••••" required>
          </div>

          <a href="index.html" class="btn btn-success">Entrar</a>
        </form>

        <div class="actions">
          <a href="cadastro.html">Criar conta</a>
          <a href="esqueci-senha.html">Esqueceu a senha?</a>
        </div>
      </div>
    </div>
  </body>
</html>
