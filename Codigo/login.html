<!DOCTYPE html>
<!--
    Tela de Login

    Autor: Sophia de Souza Fabri
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
    <link rel="stylesheet" href="css/style.css">

    <script src="js/layout.js"></script>
    <script>
      verificarAutenticacao();
    </script>

    <!-- Tipografia definida - Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="login-page">
    <div class="login-wrapper">
      
      <!-- Lado Esquerdo: Painel Institucional (igual à imagem) -->
      <div class="login-left">
        <div class="login-brand">
          <div class="logo-icon">
            <span class="mdi mdi-layers-triple"></span>
          </div>
          <span class="brand-name">Gestão de Demandas</span>
        </div>

        <div class="login-hero">
          <h1>Demandas, fluxos e entregas da sua equipe.</h1>
          <p>Acompanhe solicitações e prazos em um só lugar.</p>
        </div>
      </div>

      <!-- Lado Direito: Formulário de Acesso -->
      <div class="login-right">
        <div class="login-form-container">
          <h2>Entrar</h2>
          <p class="subtitle">Digite suas credenciais para acessar</p>

          <form id="formLogin">
            <div class="form-group mb-3">
              <label for="email">Seu e-mail</label>
              <input type="email" id="email" class="form-control login-input" placeholder="seuemail@exemplo.com" required>
            </div>

            <div class="form-group mb-3">
              <label for="senha">Senha</label>
              <input type="password" id="senha" class="form-control login-input" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-login w-100 mt-2">Entrar na minha conta</button>
          </form>

          <div class="login-actions mt-4">
            <a href="esqueci-senha.html">Esqueceu a senha?</a>
            <span>•</span>
            <a href="cadastro.html">Criar conta</a>
          </div>
        </div>
      </div>

    </div>

    <script src="js/cadastrosLogin.js"></script>
  </body>
</html>
