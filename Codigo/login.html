<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <h2>Entrar</h2>
    <p class="subtitle">Digite suas credenciais para acessar</p>
    
    <!-- Adicionado action="index.html" para redirecionar ao enviar -->
    <form action="index.html">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seuemail@exemplo.com" required>
      </div>
      
      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn">Entrar</button>
    </form>

    <div class="actions">
      <a href="cadastro.html">Criar conta</a>
      <a href="esqueci-senha.html">Esqueceu a senha?</a>
    </div>

    <div class="back-link-container">
      <a href="index.html" class="back-link">← Página inicial</a>
    </div>
  </div>

</body>
</html>
