<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Demanda</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/novademanda.css">
    <script src="js/layout.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
    
    <!-- Tipografia definida - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="topbar"></div>
    <div class="layout">
        <div id="menu"></div>
        <div class="main">
            <main class="container py-5">
                <div class="row justify-content-center">
                    <div class="col-12 col-xl-9">
                        <h2 class="mb-2">Nova Demanda</h2>
                        <form id="formAluno" class="card shadow-sm" novalidate>
                            <div class="card-body p-4">
                                <div class="row g-3">
                                    <div class="col-12">
                                        <label for="titulo" class="form-label">Título</label>
                                        <input id="titulo" class="form-control" type="text" autocomplete="titulo">
                                        <div id="erroNome" class="invalid-feedback"></div>
                                    </div>

                                    <div class="col-12">
                                        <label for="descricao" class="form-label">Descrição</label>
                                        <textarea class="form-control" id="descricao" rows="3"></textarea>
                                        <div id="erroDescricao" class="invalid-feedback"></div>
                                    </div>

                                    <div class="col-12 col-md-6">
                                        <label for="tipo" class="form-label">Tipo</label>
                                        <select id="tipo" class="form-select" required>
                                            <option value="">Selecione...</option>
                                            <option value="Tarefa">Tarefa</option>
                                            <option value="Defeito">Defeito</option>
                                            <option value="Melhoria">Melhoria</option>
                                            <option value="Documentação">Documentação</option>
                                        </select>
                                        <div id="erroTipo" class="invalid-feedback"></div>
                                    </div>

                                    <div class="col-12 col-md-6">
                                        <label for="prioridade" class="form-label">Prioridade</label>
                                        <select id="prioridade" class="form-select" required>
                                            <option value="">Selecione...</option>
                                            <option value="Crítica">Crítica</option>
                                            <option value="Alta">Alta</option>
                                            <option value="Média">Média</option>
                                            <option value="Baixa">Baixa</option>
                                        </select>
                                        <div id="erroPrioridade" class="invalid-feedback"></div>
                                    </div>

                                    <div class="col-12 col-md-4">
                                        <label for="projeto" class="form-label">Projeto Associado</label>
                                        <select id="projeto" class="form-select" required>
                                            <option value="">Selecione...</option>
                                            <option value="Projeto 1">Projeto 1</option>
                                            <option value="Projeto 2">Projeto 2</option>
                                            <option value="Projeto 3">Projeto 3</option>
                                        </select>
                                        <div id="erroProjeto" class="invalid-feedback"></div>
                                    </div>

                                    <div class="col-12 col-md-4">
                                        <label for="responsavel" class="form-label">Responsável</label>
                                        <select id="responsavel" class="form-select" required>
                                            <option value="">Selecione...</option>
                                            <option value="Responsável 1">Responsável 1</option>
                                            <option value="Responsável 2">Responsável 2</option>
                                            <option value="Responsável 3">Responsável 3</option>
                                        </select>
                                        <div id="erroResponsavel" class="invalid-feedback"></div>
                                    </div>

                                    <div class="col-12 col-md-4">
                                        <label for="prazo" class="form-label">Prazo de Finalização</label>
                                        <input id="prazo" class="form-control" type="date" required>
                                        <div id="erroPrazo" class="invalid-feedback"></div>
                                    </div>
                                </div>

                            </div>
                            <button class="nova-demanda mt-4" type="submit">Cadastrar Demanda</button>
                        </form>

                        <section id="painelResultado" class="mt-4 d-none">
                            <div class="alert alert-success">
                                Dados validados com sucesso. Nenhuma informação foi enviada ao servidor.
                            </div>
                            <h2 class="h4">Objeto convertido em JSON</h2>
                            <pre id="resultado" class="bg-dark text-light p-3 rounded"></pre>
                        </section>
                    </div>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
