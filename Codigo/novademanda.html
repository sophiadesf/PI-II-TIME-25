<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Demanda</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/layout.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
    
    <!-- Tipografia definida - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="topbar"></div>
    <div class="layout">
        <div id="menu"></div>
        <div class="container">
            <h2>Cadastro de Demandas</h2>

            <div class="item-form">
                <label for="exampleFormControlInput1" class="form-label">Título</label>
                <input class="form-control" type="text" aria-label="default input example">
            </div>

            <div class="item-form">
                <div class="mb-3">
                    <label for="exampleFormControlTextarea1" class="form-label">Descrição</label>
                    <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
                </div>
            </div>
                
            <div class="item-form">
                <label for="exampleFormControlInput1" class="form-label">Tipo</label>
                <select class="form-select" aria-label="Default select example">
                    <option selected>Selecione...</option>
                    <option value="1">Tarefa</option>
                    <option value="2">Defeito</option>
                    <option value="3">Melhoria</option>
                    <option value="4">Documentação</option>
                </select>
            </div>

            <div class="item-form">
                <label for="exampleFormControlInput1" class="form-label">Prioridade</label>
                <select class="form-select" aria-label="Default select example">
                    <option selected>Selecione...</option>
                    <option value="1">Crítica</option>
                    <option value="2">Alta</option>
                    <option value="3">Média</option>
                    <option value="4">Baixa</option>
                </select>
            </div>

            <div class="item-form">
                <label for="exampleFormControlInput1" class="form-label">Projeto Associado</label>
                <select class="form-select" aria-label="Default select example">
                    <option selected>Selecione...</option>
                    <option value="1">Projeto 1</option>
                    <option value="2">Projeto 2</option>
                    <option value="3">Projeto 3</option>
                </select>
            </div>

            <div class="item-form">
                <label for="exampleFormControlInput1" class="form-label">Responsável</label>
                <select class="form-select" aria-label="Default select example">
                    <option selected>Selecione...</option>
                    <option value="1">Responsável 1</option>
                    <option value="2">Responsável 2</option>
                    <option value="3">Responsável 3</option>
                </select>
            </div>

            <div class="item-form">
                <div class="mb-3">
                    <label for="data" class="form-label">Prazo de Finalização</label>
                    <input type="date" class="form-control" id="data" name="data">
                </div>
            </div>

            <div class="item-form">
                <div class="botoes">
                    <button type="button" class="btn btn-primary btn-sm">Salvar</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
