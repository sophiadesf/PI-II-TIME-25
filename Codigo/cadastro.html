<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">

  <!-- AUDITORIA SOPHIA FABRI, tela de cadastro -->

  <!-- Tipografia definida - Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="topbar"></div>
  <div class="mt-5 pt-5">
    <div class="card m-3">
      <h2>Criar Conta</h2>
      <p class="subtitle">Preencha os dados abaixo para se cadastrar</p>
      
      <!-- Adicionado id="formCadastro" -->
      <form id="formCadastro">
        <div class="form-group">
          <label for="nome">Nome Completo</label>
          <input type="text" id="nome" placeholder="Seu nome" required>
        </div>

        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="seuemail@exemplo.com" required>
        </div>
        
        <div class="form-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="••••••••" required>
          <small class="form-text text-muted d-block">A senha deve conter pelo menos 8 caracteres, incluindo letras maiúsculas, minúsculas, números e símbolos.</small>
        </div>

        <!-- Adicionado o campo confirmaSenha que o seu JS verifica obrigatoriamente -->
        <div class="form-group">
          <label for="confirmaSenha">Confirmar Senha</label>
          <input type="password" id="confirmaSenha" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-success w-100 mt-3">Cadastrar</button>
      </form>

      <div class="actions mt-3" style="justify-content: center;">
        <span>Já tem uma conta?&nbsp;</span>
        <a href="login.html">Fazer Login</a>
      </div>

      <div class="back-link-container mt-2">
        <a href="login.html" class="back-link">← Página inicial</a>
      </div>
    </div>
  </div>

  <script src="js/cadastrosLogin.js"></script>
</body>
</html>
